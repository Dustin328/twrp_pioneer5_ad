name: Build TWRP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev python3-pip xz-utils
          
      - name: Clean Build Output
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          sudo killall -9 java python* 2>/dev/null || true
          [ -d out ] && sudo rm -rf out/ || true
          [ -d .repo/worktrees ] && sudo rm -rf .repo/worktrees || true

      - name: Sync TWRP Minimal Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.email "twrp@twrp.me"
          git config --global user.name "TeamWin"
          curl https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          ./repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ./repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          mkdir -p device/sstar/pioneer5_ad
          cp -r $GITHUB_WORKSPACE/device/sstar/pioneer5_ad/* device/sstar/pioneer5_ad/

      - name: Apply Unisoc DRM Patch
        run: |
          cd ~/twrp
          cp $GITHUB_WORKSPACE/patches/graphics_drm.cpp bootable/recovery/minuitwrp/graphics_drm.cpp

      - name: Apply Unisoc BCB Fix
        run: |
          cd ~/twrp
          python3 $GITHUB_WORKSPACE/patches/apply_misc_bcb_fix.py bootable/recovery/twrp-functions.cpp
          # Robust OpenAES removal: Patch source and build config
          python3 $GITHUB_WORKSPACE/patches/remove_openaes.py bootable/recovery
          # Verify patching
          grep -C 5 "Try_Decrypting_File" bootable/recovery/twrp-functions.cpp

      - name: Build
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_pioneer5_ad-userdebug
          mka -j2 recoveryimage
          # DTB is now embedded by mkbootimg via BOARD_PREBUILT_DTB --dtb.
          # The raw post-append we used to do breaks the SigmaStar SPL
          # signature region and shifts sector boundaries out from
          # under the ATAG path on ums512 / ums512_1h10 (Pioneer5 AD).

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pioneer5_ad
          path: /home/runner/twrp/out/target/product/pioneer5_ad/recovery.img
