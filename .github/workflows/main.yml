name: Build TWRP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev python3-pip
          
      - name: Clean Build Output
        run: |
          cd ~/twrp || mkdir ~/twrp && cd ~/twrp
          sudo killall -9 java python* 2>/dev/null || true
          sudo rm -rf out/
          sudo rm -rf .repo/project-objects .repo/projects .repo/worktrees 2>/dev/null || true

      - name: Sync TWRP Minimal Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.email "twrp@twrp.me"
          git config --global user.name "TeamWin"
          curl https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          ./repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          
          # Retry sync with exponential backoff
          for attempt in {1..5}; do
            echo "Sync attempt $attempt of 5..."
            if ./repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags; then
              echo "Sync successful"
              break
            fi
            if [ $attempt -lt 5 ]; then
              wait_time=$((30 * attempt))
              echo "Sync failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            else
              echo "Sync failed after 5 attempts"
              exit 1
            fi
          done

      - name: Manually Clone libopenaes
        run: |
          cd ~/twrp
          rm -rf external/openaes
          git clone --depth=1 https://github.com/TeamWin/android_external_openaes.git external/openaes

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          mkdir -p device/sstar/pioneer5_ad
          cp -r $GITHUB_WORKSPACE/device/sstar/pioneer5_ad/* device/sstar/pioneer5_ad/

      - name: Apply Unisoc DRM Patch
        run: |
          cd ~/twrp
          cp $GITHUB_WORKSPACE/patches/graphics_drm.cpp bootable/recovery/minuitwrp/graphics_drm.cpp

      - name: Apply Unisoc BCB Fix
        run: |
          cd ~/twrp
          python3 $GITHUB_WORKSPACE/patches/apply_misc_bcb_fix.py bootable/recovery/twrp-functions.cpp

      - name: Build
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_pioneer5_ad-userdebug
          mka recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pioneer5_ad
          path: /home/runner/twrp/out/target/product/pioneer5_ad/recovery.img
